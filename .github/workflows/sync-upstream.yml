name: Sync upstream main and tags
run-name: Sync upstream main and tags

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'nocoly/pd-openweb' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out destination main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false

      - name: Merge upstream updates and synchronize tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/mingdaocom/pd-openweb.git
          git fetch --no-tags upstream refs/heads/main:refs/remotes/upstream/main
          git fetch --no-tags upstream '+refs/tags/*:refs/upstream-tags/*'
          upstream_sha=$(git rev-parse refs/remotes/upstream/main)

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Already synchronized with upstream main ($upstream_sha)." >> "$GITHUB_STEP_SUMMARY"
          else
            # Pause before committing, even for a fast-forward, to preserve our README.
            git merge --no-commit --no-ff --no-stat "$upstream_sha" || true
            if ! git rev-parse --quiet --verify MERGE_HEAD > /dev/null; then
              echo '::error::Unable to start upstream merge; remote main was not changed.'
              exit 1
            fi

            if git cat-file -e HEAD:README.md 2>/dev/null; then
              git restore --source=HEAD --staged --worktree -- README.md
            else
              git rm --force --ignore-unmatch -- README.md
            fi

            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              git merge --abort
              echo '::error::Upstream merge has conflicts outside README.md. Resolve them manually; remote main was not changed.'
              exit 1
            fi

            git commit --no-edit
          fi

          # Preserve existing destination tags, including tags that differ from upstream.
          git fetch --no-tags origin '+refs/tags/*:refs/destination-tags/*'
          push_refs=(HEAD:refs/heads/main)
          while IFS=' ' read -r upstream_tag_sha tag; do
            if destination_tag_sha=$(git rev-parse --quiet --verify "refs/destination-tags/$tag"); then
              if [[ "$destination_tag_sha" != "$upstream_tag_sha" ]]; then
                echo "::warning::Tag $tag differs from upstream; preserving the destination tag."
                echo "Preserved differing destination tag: $tag." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              push_refs+=("refs/upstream-tags/$tag:refs/tags/$tag")
            fi
          done < <(git for-each-ref --format='%(objectname) %(refname:strip=2)' refs/upstream-tags/)

          git push --atomic origin "${push_refs[@]}"
          echo "Synchronized upstream main ($upstream_sha) and missing tags, preserving the destination README.md and existing tags." >> "$GITHUB_STEP_SUMMARY"
